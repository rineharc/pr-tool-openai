name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.2"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.2"
          cache: true
      - run: make cross-build VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@v6
        with:
          name: prr-cross-platform
          path: dist/
